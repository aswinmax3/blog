{% extends 'blogs/base.html' %}

{% block content %}

<h2>All Posts</h2>

{% for post in posts %}
    <div class="card">
        <h3>{{ post.title }}</h3>
        <p class="meta">
            Blog: {{ post.blog.title }} | {{ post.date_added }}
        </p>

        <p>{{ post.content }}</p>

        <a href="{% url 'blogs:edit_post' post.id %}">Edit</a>
    </div>

{% empty %}
    <p>No posts available.</p>
{% endfor %}

{% endblock content %}
